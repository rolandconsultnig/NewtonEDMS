# nginx reverse proxy for NewEDMS.
# Install:  sudo cp deploy/nginx-newedms.conf /etc/nginx/sites-available/newedms
#           sudo ln -s /etc/nginx/sites-available/newedms /etc/nginx/sites-enabled/
#           sudo nginx -t && sudo systemctl reload nginx
# TLS:     sudo certbot --nginx -d edms.example.com
#          then set EDMS_COOKIE_SECURE=true in /etc/newedms/newedms.env

server {
    listen 2080;
    server_name _;   # Matches any domain or server IP on port 2080

    # Must be >= EDMS_MAX_UPLOAD_BYTES (default 50 MiB).
    client_max_body_size 100m;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_read_timeout 300s;      # OCR / large exports / long-lived jobs
        proxy_send_timeout 300s;
        proxy_connect_timeout 60s;
        proxy_buffering off;
    }

    # Prevent direct access to sensitive paths or files
    location ~* /(\.git|\.env|storage/|\.db) {
        deny all;
        return 404;
    }
}
