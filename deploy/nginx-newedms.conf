# nginx reverse proxy for NewEDMS.
# Install:  sudo cp deploy/nginx-newedms.conf /etc/nginx/sites-available/newedms
#           sudo ln -s /etc/nginx/sites-available/newedms /etc/nginx/sites-enabled/
#           sudo nginx -t && sudo systemctl reload nginx
# TLS:     sudo certbot --nginx -d edms.example.com
#          then set EDMS_COOKIE_SECURE=true in /etc/newedms/newedms.env

server {
    listen 80;
    server_name edms.example.com;   # <- change me

    # Must be >= EDMS_MAX_UPLOAD_BYTES (default 50 MiB).
    client_max_body_size 60m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;      # large exports/backups
    }

    # Never serve the raw database or exports if a storage path is ever exposed
    # by mistake; harmless if unused.
    location ~* /(edms\.db|storage/) {
        deny all;
    }
}
