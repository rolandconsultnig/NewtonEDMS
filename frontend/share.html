<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NewtonEDMS Share</title>
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/static/favicon-16x16.png" />
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png" />
  <link rel="manifest" href="/static/manifest.webmanifest" />

  <meta property="og:title" content="NewtonEDMS — Secure Share" />
  <meta property="og:image" content="/static/og-image.png" />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:image" content="/static/og-image.png" />

  <style>
    body { font-family: sans-serif; max-width: 28rem; margin: 2rem auto; padding: 1rem; }
    input, button, select { display: block; width: 100%; margin: .5rem 0; padding: .6rem; }
  </style>
</head>
<body>
  <div style="display:flex; align-items:center; gap:12px; margin-bottom:20px;">
    <img src="/static/logo.png" alt="NewtonEDMS" style="height:160px; width:auto; max-width:500px; object-fit:contain;" />
  </div>
  <h1>NewtonEDMS</h1>
  <p>Share / upload to an open source URL.</p>
  <label>Source token</label>
  <input id="token" placeholder="from your open upload URL" />
  <input id="file" type="file" multiple />
  <button onclick="send()">Upload</button>
  <p id="msg"></p>
  <script>
    async function send() {
      const token = document.getElementById("token").value.trim();
      const files = document.getElementById("file").files;
      const msg = document.getElementById("msg");
      if (!token || !files.length) { msg.textContent = "Token and file required"; return; }
      for (const f of files) {
        const fd = new FormData();
        fd.append("file", f);
        const r = await fetch("/api/v1/open/upload/item/" + encodeURIComponent(token), { method: "POST", body: fd });
        const t = await r.text();
        msg.textContent = r.ok ? "Uploaded " + f.name : t;
        if (!r.ok) break;
      }
    }
    const params = new URLSearchParams(location.search);
    if (params.get("token")) document.getElementById("token").value = params.get("token");
  </script>
</body>
</html>
